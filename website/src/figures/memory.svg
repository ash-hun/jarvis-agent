<text class="pf-s" x="640.0" y="229.0" text-anchor="middle">읽기만, 스킬 파일이 정본</text>
<path class="pf-edge" d="M600.0,184.0 L600.0,166.0" marker-end="url(#memory-h)"/>
<rect class="pf-panel" x="16" y="260" width="728" height="136" rx="8"/>
<text class="pf-plabel" x="28" y="386">(b) 턴마다 그 턴을 일화로 쓰고, 나머지는 정해진 순간에만 쓴다</text>
<rect class="pf-box" x="26.0" y="290" width="124" height="66" rx="6"/>
<text class="pf-t" x="88.0" y="311" text-anchor="middle">/remember</text>
<text class="pf-s" x="88.0" y="330" text-anchor="middle">사용자 프로필 사실</text>
<text class="pf-s" x="88.0" y="346" text-anchor="middle">주거 프로필 도구도</text>
<path class="pf-edge" d="M88.0,290.0 L88.0,242.0" marker-end="url(#memory-h)"/>
