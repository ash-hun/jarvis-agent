name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra web --extra scheduler --extra mcp --extra gemini
      - run: uv run ruff check src tests
      - run: uv run python scripts/sort_imports.py --check src tests scripts
      - run: uv run pytest tests/unit -q
      - run: uv run pytest tests/integ -q
