    note: 만 25세 미만 단독세대주는 한도 1.2억. 대출 접수일에 이미 공공임대에 살고 있으면 안 된다

  - id: bank_jeonse
    name: 시중은행 전세자금대출(HF 보증)
    purpose: deposit
    provider: 시중은행
    basis: 기사
    source: https://www.hf.go.kr/ko/sub02/sub02_01_07_01.do
    rate: [4.28, 4.81]
    rate_basis: 주택금융공사 공시 2026-10-12~18 주간 평균(우리 4.28, 국민 4.50, 하나 4.81)
    ratio: 80
