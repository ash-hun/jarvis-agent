server {
    listen 80;
    server_name _;

    # Docker 내부 DNS로 매 요청마다 backend를 다시 resolve한다.
    # proxy_pass에 변수($backend)를 써야 nginx가 upstream을 시작 시 고정하지 않는다.
    # backend 단독 재기동으로 IP가 바뀌어도 stale upstream 502가 나지 않음.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # REST API 프록시 → Python 백엔드
    location /api/ {
        set $backend jarvis-backend:7777;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 프록시 → Python 백엔드
    location /ws {
        set $backend jarvis-backend:7777;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
