<text class="pf-s" x="536.0" y="140" text-anchor="middle">[작업 공유 메모리] 위임 중</text>
<text class="pf-s" x="536.0" y="156" text-anchor="middle">최근 3턴</text>
<rect class="pf-box pf-box--accent" x="648.0" y="92" width="72" height="40" rx="6"/>
<text class="pf-t pf-t--accent" x="684.0" y="116.5" text-anchor="middle">LLM</text>
