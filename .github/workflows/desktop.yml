name: Desktop

# release.yml 이 GitHub Release 를 만든 뒤 이 워크플로를 불러 그 태그로 데스크톱 앱(macOS dmg, zip)을 빌드해 같은 Release 에 올린다.
# GITHUB_TOKEN 이 만든 Release 는 `on: release` 를 깨우지 않으므로(GitHub 규칙, v0.3.0 실측) workflow_call 로 잇는다.
# Apple Developer Program 에 가입하지 않아 서명과 공증은 없다. 받은 앱은 처음 한 번 Gatekeeper 를 풀어야 한다(README).
# 같은 태그로 다시 돌리면 --clobber 로 같은 이름의 파일을 덮어 결과가 같다.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "올릴 Release 태그 (예: v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build
        working-directory: desktop
        env:
          # 서명 신원을 찾지 않는다. 없으면 electron-builder 가 경고만 하고 서명 없이 만든다
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist
          ls -la dist/*.dmg dist/*.zip

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" desktop/dist/*.dmg desktop/dist/*.zip --clobber
          # 설치 안내는 한 번만 붙인다. 이미 있으면 그대로 둔다
          body="$(gh release view "$TAG" --json body -q .body)"
          if ! grep -q 'desktop-install-note' <<<"$body"; then
            printf '%s\n\n<!-- desktop-install-note -->\n## 데스크톱 앱 설치\n\nApple 서명이 없는 앱이라 처음 열 때 macOS 가 막는다. `Jarvis-<버전>-<arch>.dmg` 를 열어 Applications 로 옮긴 뒤 터미널에서 `xattr -dr com.apple.quarantine /Applications/Jarvis.app` 을 한 번 실행하거나, 시스템 설정 > 개인정보 보호 및 보안에서 "그래도 열기"를 누른다. Apple Silicon 은 arm64, Intel 은 x64.\n' "$body" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
