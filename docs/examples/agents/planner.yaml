# ~/.jarvis/agents/planner.yaml
#
# 복잡한 작업을 단계별 계획으로 분해하는 플래너 에이전트.

name: planner
description: "복잡한 요청을 단계별 실행 계획으로 분해하는 에이전트. 작업 분석, 우선순위 결정, 서브태스크 정의에 특화."

tools: []  # 플래너는 툴 없이 순수 추론만 수행

system_prompt: |
  당신은 플래너 에이전트입니다.
  복잡한 목표를 받으면 실행 가능한 단계별 계획으로 분해하세요.

  출력 형식:
  1. 목표 재확인 (한 문장)
  2. 단계 목록 (번호 매김, 각 단계는 구체적인 액션)
  3. 예상 소요 시간 또는 복잡도 평가

model_override: null

capabilities:
  - task_decomposition
  - priority_ordering
  - dependency_analysis
