services:
  # ── 테스트 실행 (실 API 없이) ────────────────────────────────────────────────
  test:
    build:
      context: .
      target: test
    environment:
      JARVIS_DEBUG: "true"
      JARVIS_LLM__PROVIDER: "faux"
      JARVIS_LLM__MODEL: "faux-model"
      JARVIS_MEMORY__BACKEND: "in_memory"
      JARVIS_SESSION__SESSIONS_DIR: "/tmp/jarvis/sessions"
      JARVIS_MEMORY__SQLITE_PATH: "/tmp/jarvis/memory.db"
      JARVIS_SECURITY__REQUIRE_AUTH: "false"
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    command: ["uv", "run", "pytest", "-v", "--no-header", "--tb=short"]

  # ── 특정 테스트만 실행: docker compose run --rm test-single ──────────────────
  test-single:
    build:
      context: .
      target: test
    environment:
      JARVIS_DEBUG: "true"
      JARVIS_LLM__PROVIDER: "faux"
      JARVIS_SECURITY__REQUIRE_AUTH: "false"
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    profiles: ["manual"]
    command: ["uv", "run", "pytest", "-v", "--no-header", "--tb=long", "-s"]

  # ── TUI 실행 ─────────────────────────────────────────────────────────────────
  jarvis:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    volumes:
      - jarvis_data:/root/.jarvis
    stdin_open: true
    tty: true
    profiles: ["app"]

  # ── Web HUD 백엔드 (FastAPI + WebSocket + Agent) ───────────────────────────
  jarvis-backend:
    build:
      context: .
      target: runtime-web
    env_file:
      - .env
    environment:
      JARVIS_LLM__PROVIDER: ${JARVIS_LLM__PROVIDER:-anthropic}
    volumes:
      - jarvis_data:/root/.jarvis
    profiles: ["web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 7777), timeout=2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── Web HUD 프론트엔드 (nginx 정적 파일 + /ws 프록시) ─────────────────────────
  jarvis-frontend:
    image: nginx:alpine
    ports:
      - "7777:80"
    volumes:
      - ./src/jarvis/ui/web/static:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jarvis-backend:
        condition: service_healthy
    profiles: ["web"]

volumes:
  jarvis_data:
