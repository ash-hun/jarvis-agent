[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A personal assistant agent with extensible harness"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",

    # LLM Providers
    "litellm>=1.50.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",

    # TUI
    "textual>=0.80.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "pycryptodome>=3.20.0",

    # Storage & Memory
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0.0",

    # Plugin System
    "watchfiles>=0.24.0",

    # Skills (YAML frontmatter)
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]
vector-memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
]
postgres = [
    "asyncpg>=0.30.0",
]

[project.scripts]
jarvis = "jarvis.ui.tui.app:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "ipython",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
