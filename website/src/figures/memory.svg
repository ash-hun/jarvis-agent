<text class="pf-s" x="363.0" y="346" text-anchor="middle">성공 3번이면 절차 초안</text>
<path class="pf-edge" d="M363.0,290.0 L363.0,242.0" marker-end="url(#memory-h)"/>
<rect class="pf-box" x="443.0" y="290" width="124" height="66" rx="6"/>
