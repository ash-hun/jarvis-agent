# 클라이언트가 /ws?session_id=...&token=<키> 로 붙는다. 기본 로그는 쿼리를 포함한 $request 를 찍어 docker logs 에
# 키가 남는다. 쿼리를 뺀 $uri 만 찍는다(session_id 도 빠진다). 이 파일은 http 블록 안에 include 된다
log_format notoken '$remote_addr - [$time_local] "$request_method $uri" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log notoken;
    server_name _;

    # Docker 내부 DNS로 매 요청마다 backend를 다시 resolve한다.
    # proxy_pass에 변수($backend)를 써야 nginx가 upstream을 시작 시 고정하지 않는다.
    # backend 단독 재기동으로 IP가 바뀌어도 stale upstream 502가 나지 않음.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # REST API 프록시 → Python 백엔드
    location /api/ {
        set $backend jarvis-backend:7777;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 프록시 → Python 백엔드
    location /ws {
        set $backend jarvis-backend:7777;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Service worker — 항상 새로 받아야 갱신이 막히지 않는다(스코프는 루트).
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # 브랜드(PWA manifest 포함) — 에이전트별 이름·색은 백엔드 설정에서 만들어지므로
    # 정적 파일이 아니라 백엔드로 프록시한다.
    location ~ ^/(brand\.js|manifest\.json)$ {
        set $backend jarvis-backend:7777;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache";
    }

    # 정적 파일 서빙 — 매번 ETag 로 재검증한다. 휴리스틱 캐시에 걸리면 고친 js/css 가 다음 로드까지 안 보인다.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
