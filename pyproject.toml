[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A personal assistant agent with extensible harness"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",
    # LLM Providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    # TUI
    "textual>=0.80.0",
    # Storage & Memory
    "asyncpg>=0.30.0",
    "aiofiles>=24.0.0",
    # Plugin System
    "watchfiles>=0.24.0",
    # Skills (YAML frontmatter)
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "pypdf>=6.20.0",
    # Logging (common/logger.py). 콘솔 렌더는 textual 이 이미 가져오는 rich 를 쓴다
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    # 앱(iOS 홈 화면 웹앱)으로 보내는 Web Push. VAPID 서명과 본문 암호화
    "pywebpush>=2.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "supertonic>=0.1.0",
    "numpy>=1.26.0",
]
mcp = [
    "mcp>=2.0,<3",
]
gemini = [
    "google-genai>=1.0.0",
]
scheduler = [
    "croniter>=2.0.0",
]
piper = [
    "piper-tts>=1.8,<2",
]
# 디스코드 봇이 사용자가 있는 음성 채널에서 알림을 읽는다(JARVIS_NOTIFY__DISCORD_BOT_TOKEN). 재생에 ffmpeg 가 필요하다.
# 읽는 목소리는 서버 한국어 TTS(supertonic)라 voice extra 의 STT(faster-whisper) 없이 그것만 함께 깐다
discord = [
    "discord.py[voice]>=2.7,<3",
    "supertonic>=0.1.0",
    "numpy>=1.26.0",
]
# "Jarvis" 웨이크워드(JARVIS_VOICE__WAKE_MODEL_DIR). onnx 로만 돌린다
wake = [
    "openwakeword==0.6.0",
]

[project.scripts]
jarvis = "jarvis.ui.tui.app:main"

[tool.uv]
# openwakeword 는 리눅스에서 tflite-runtime 을 요구하지만 arm64 휠이 없어 Docker(Apple Silicon)에서 설치가 깨진다.
# onnx 로만 돌리므로 빼 둔다(tflite 는 inference_framework="tflite" 일 때만 import 된다)
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "ipython",
    "testcontainers[postgres]>=4.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]  # import 순서는 CLAUDE.md 규칙이라 scripts/sort_imports.py 가 본다
ignore = ["B008", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# 패키지 모드로 본다. 경로 모드(src/jarvis)는 jarvis 를 설치된 외부 모듈로 보고 import-untyped 를 쏟아낸다
mypy_path = "src"
packages = ["jarvis"]

[[tool.mypy.overrides]]
# 음성 extra(piper, wake, supertonic)를 깔지 않은 환경에서도 같은 결과가 나오게 선택 의존성은 없는 것으로 본다
module = [
    "google.*", "mcp.*", "piper", "piper.*", "openwakeword", "openwakeword.*", "supertonic", "numpy", "discord", "discord.*",
]
ignore_missing_imports = true

# 스텁 없이 쓰는 서드파티. 개발 의존성을 늘리지 않으려고 모듈 단위로만 건다
[[tool.mypy.overrides]]
module = ["yaml", "aiofiles", "aiofiles.*", "asyncpg", "asyncpg.*", "croniter", "pywebpush"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["memory_eval: 메모리 기능별 평가 스위트"]
