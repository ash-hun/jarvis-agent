services:
  # ── 테스트 실행 (실 API 없이) ────────────────────────────────────────────────
  test:
    build:
      context: .
      target: test
    environment:
      JARVIS_DEBUG: "true"
      JARVIS_LLM__PROVIDER: "faux"
      JARVIS_LLM__MODEL: "faux-model"
      JARVIS_MEMORY__BACKEND: "in_memory"
      JARVIS_SESSION__SESSIONS_DIR: "/tmp/jarvis/sessions"
      JARVIS_MEMORY__SQLITE_PATH: "/tmp/jarvis/memory.db"
      JARVIS_SECURITY__REQUIRE_AUTH: "false"
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    # 프로필 없이 `up` 할 때 끼어들지 않도록 분리 — `docker compose run --rm test` 로 실행
    profiles: ["test"]
    command: ["uv", "run", "pytest", "-v", "--no-header", "--tb=short"]

  # ── 특정 테스트만 실행: docker compose run --rm test-single ──────────────────
  test-single:
    build:
      context: .
      target: test
    environment:
      JARVIS_DEBUG: "true"
      JARVIS_LLM__PROVIDER: "faux"
      JARVIS_SECURITY__REQUIRE_AUTH: "false"
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
    profiles: ["manual"]
    command: ["uv", "run", "pytest", "-v", "--no-header", "--tb=long", "-s"]

  # ── PostgreSQL (세션 영속성) ──────────────────────────────────────────────────
  # app/web 프로파일에서 자동 기동. 외부 DB를 쓸 때는 JARVIS_SESSION__POSTGRES_DSN을
  # .env에 설정하면 해당 DSN이 우선 적용된다.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles: ["app", "web"]

  # ── TUI 실행 ─────────────────────────────────────────────────────────────────
  jarvis:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      # postgres가 기본. 외부 DSN이 .env에 있으면 그쪽을 사용한다.
      JARVIS_SESSION__PERSISTENCE_BACKEND: postgres
      JARVIS_SESSION__POSTGRES_DSN: ${JARVIS_SESSION__POSTGRES_DSN:-postgresql://jarvis:jarvis@postgres:5432/jarvis}
    volumes:
      - jarvis_data:/root/.jarvis
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  # ── Web HUD 백엔드 (FastAPI + WebSocket + Agent) ───────────────────────────
  jarvis-backend:
    build:
      context: .
      target: runtime-web
    env_file:
      - .env
    environment:
      # 스케줄(cron)과 /schedule 마감 시각은 컨테이너 로컬 시간으로 해석된다.
      # 기본 UTC 이면 "오전 9시"가 한국 시간 18시에 돈다 — .env 의 TZ 로 바꿀 수 있다.
      TZ: ${TZ:-Asia/Seoul}
      JARVIS_LLM__PROVIDER: ${JARVIS_LLM__PROVIDER:-anthropic}
      # Inner Thought(Tier 0) + Proactive(Tier 1). 기본 on — false로 끌 수 있다.
      JARVIS_THOUGHT__ENABLED: ${JARVIS_THOUGHT__ENABLED:-true}
      JARVIS_THOUGHT__MODEL: ${JARVIS_THOUGHT__MODEL:-}
      JARVIS_PROACTIVE__ENABLED: ${JARVIS_PROACTIVE__ENABLED:-true}
      # 자율 성찰 daemon — 기본 on (요청 없이 먼저 말 검).
      JARVIS_PROACTIVE__DAEMON_ENABLED: ${JARVIS_PROACTIVE__DAEMON_ENABLED:-true}
      # postgres가 기본. 외부 DSN이 .env에 있으면 그쪽을 사용한다.
      JARVIS_SESSION__PERSISTENCE_BACKEND: postgres
      JARVIS_SESSION__POSTGRES_DSN: ${JARVIS_SESSION__POSTGRES_DSN:-postgresql://jarvis:jarvis@postgres:5432/jarvis}
    volumes:
      - jarvis_data:/root/.jarvis
      # 로컬 코드를 그대로 쓴다 — 파이썬 수정 후 이미지 재빌드 없이
      # `docker compose restart jarvis-backend` 만으로 반영된다.
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 7777), timeout=2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── Web HUD 프론트엔드 (nginx 정적 파일 + /ws 프록시) ─────────────────────────
  jarvis-frontend:
    image: nginx:alpine
    ports:
      - "7777:80"
    volumes:
      - ./src/jarvis/ui/web/static:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jarvis-backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["web"]

volumes:
  jarvis_data:
  postgres_data:
