<text class="pf-s" x="505.0" y="346" text-anchor="middle">사고 로그는 회상 제외</text>
<path class="pf-edge" d="M505.0,290.0 L505.0,280.0 L420.0,280.0 L420.0,242.0" marker-end="url(#memory-h)"/>
<rect class="pf-box" x="576.0" y="290" width="166" height="66" rx="6"/>
<text class="pf-t" x="659.0" y="311" text-anchor="middle">remember_task_pattern</text>
<text class="pf-s" x="659.0" y="330" text-anchor="middle">절차(PDM), 에이전트별</text>
<text class="pf-s" x="659.0" y="346" text-anchor="middle">사용자가 알려 준 방식</text>
